name: Frontend CI

on:
  push:
    branches:
      - develop
      - main
      - "feature/**"
      - "fix/**"
      - "sprint8/**"

  pull_request:
    branches:
      - develop
      - main

jobs:
  quotation-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:quotation-quality
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-quotation-quality-coverage
          path: coverage/quotation-quality
  frontend-ci:
    uses: ConstructPro-ERP/infra/.github/workflows/frontend-ci.yml@v1
